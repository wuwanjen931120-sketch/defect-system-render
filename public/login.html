<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入 - 瑕疵辨識與分流系統</title><link href="style.css" rel="stylesheet"><link href="login.page.css" rel="stylesheet"></head><body><div class="wrap"><main class="loginCard"><header class="loginHeader"><div class="logo"></div><div><h1 class="title">登入</h1><p class="sub">請輸入註冊完成的 Email 與密碼。</p></div></header><div class="err" id="errBox"></div><div class="ok" id="okBox"></div><div class="serviceStatus" id="serviceStatus">正在檢查登入服務...</div><section class="loginFields"><label for="email">信箱</label><input autocomplete="email" id="email" placeholder="請輸入信箱" type="email"><label for="pass">密碼</label><input autocomplete="current-password" id="pass" placeholder="請輸入密碼" type="password"></section><div class="primaryActions"><button class="btn btnPrimary" id="btnLogin" type="button">登入</button></div><div class="loginHelp"><button class="textAction" id="btnFix" type="button">遇到登入或快取問題？按此修復</button></div><div class="registerBox"><div><strong>尚未註冊帳號？</strong><span>註冊時需完成 Email 驗證碼。</span></div><button class="btn" id="btnRegister" type="button">前往註冊</button></div></main></div><div id="errorBar"></div><script defer src="login.js?v=20261007-1"></script></body></html>
