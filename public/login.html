<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>登入 - 瑕疵辨識與分流系統</title>
<link href="style.css?v=20260727-1" rel="stylesheet"/>
<link href="manifest.webmanifest" rel="manifest"/>
<meta content="#0b1220" name="theme-color"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<link href="login.page.css?v=20260727-1" rel="stylesheet"/>
<script src="vendor/dompurify.min.js"></script>
<script src="safe-dom.js"></script>
</head>
<body>
<div class="wrap">
<main class="loginCard">
<header class="loginHeader">
<div class="logo"></div>
<div>
<h1 class="title">登入</h1>
<p class="sub">請輸入信箱、密碼與信箱驗證碼進入系統。</p>
</div>
</header>

<div class="err" id="errBox"></div>
<div class="ok" id="okBox"></div>
<div aria-live="polite" class="serviceStatus" id="serviceStatus" role="status">正在檢查登入服務...</div>

<section class="loginFields" aria-label="登入資料">
<label for="email">信箱</label>
<input autocomplete="email" id="email" placeholder="請輸入信箱" type="email"/>

<label for="pass">密碼</label>
<input autocomplete="current-password" id="pass" placeholder="請輸入密碼" type="password"/>

<label for="code">信箱驗證碼</label>
<input autocomplete="one-time-code" id="code" inputmode="numeric" maxlength="6" placeholder="請輸入信箱收到的 6 位數驗證碼"/>
</section>

<div class="primaryActions">
<button class="btn" id="btnSendCode" type="button">寄送驗證碼</button>
<button class="btn btnPrimary" id="btnLogin" type="button">驗證並登入</button>
</div>

<div class="loginHelp">
<p>登入流程：先輸入信箱與密碼寄送驗證碼，再輸入信箱收到的 6 位數驗證碼登入。</p>
<button class="textAction" id="btnFix" type="button">遇到登入或快取問題？按此修復</button>
</div>

<div class="registerBox">
<div>
<strong>尚未註冊帳號？</strong>
<span>先建立客戶帳號後即可登入。</span>
</div>
<button class="btn" id="btnRegister" type="button">前往註冊</button>
</div>
</main>
</div>
<div id="errorBar"></div>
<script defer src="login.js?v=20260727-2"></script>
</body>
</html>
