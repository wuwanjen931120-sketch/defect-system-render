<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>註冊 - 瑕疵辨識與分流系統</title><link href="style.css" rel="stylesheet"><link href="register.page.css" rel="stylesheet"></head><body><div class="wrap"><div class="card"><h1 class="title">客戶註冊</h1><div class="sub">註冊需先驗證 Email。註冊完成後不建立假資料或預設機台。</div><div class="err" id="errBox"></div><div class="ok" id="okBox"></div><label for="company">公司名稱</label><input id="company" placeholder="請輸入公司名稱"><label for="username">登入 Email</label><input autocomplete="email" id="username" type="email" placeholder="name@example.com"><label for="password">密碼</label><input autocomplete="new-password" id="password" type="password" minlength="10" placeholder="至少 10 碼，需含英文與數字"><label for="code">Email 驗證碼</label><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="6 位數驗證碼"><button class="btn" id="btnSendCode" type="button">寄送驗證碼</button></div><label for="inviteCode">註冊邀請碼（管理員有設定時才需要）</label><input id="inviteCode" type="password" placeholder="未設定可留空"><div class="row"><button class="btn btnPrimary" id="btnRegister">註冊</button><button class="btn" id="backLogin" type="button">回登入</button></div></div></div><script src="register.inline-1.js?v=20261007-1"></script></body></html>
