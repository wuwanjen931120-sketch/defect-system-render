<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>報表中心 - 瑕疵辨識與分流系統</title>

  <script src="auth-bootstrap.js?v=20260811-1"></script>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="unified-sidebar.css" />
  <link rel="stylesheet" href="report.css?v=20260811-1" />

  <script defer src="core.js?v=20260811-1"></script>
  <script defer src="report.js?v=20260811-1"></script>
</head>

<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="logo"></div>

        <div>
          <h1>瑕疵辨識與分流系統</h1>
          <p>Defect System</p>
        </div>
      </div>

      <div class="nav">
        <a href="dashboard.html">
          <span class="nav-label">🏠 首頁</span>
          <span class="pill">Dashboard</span>
        </a>

        <a href="logs.html">
          <span class="nav-label">🧾 事件紀錄</span>
          <span class="pill">Logs</span>
        </a>

        <a href="settings.html">
          <span class="nav-label">⚙️ 系統設定</span>
          <span class="pill">Settings</span>
        </a>

        <a href="ai.html">
          <span class="nav-label">🤖 AI 助理</span>
          <span class="pill">AI</span>
        </a>

        <a href="health.html">
          <span class="nav-label">🩺 系統健康</span>
          <span class="pill">Health</span>
        </a>

        <a href="alerts.html">
          <span class="nav-label">🚨 告警中心</span>
          <span class="pill">Alerts</span>
        </a>

        <a href="machine-status.html">
          <span class="nav-label">🖥️ 機台狀態</span>
          <span class="pill">Machines</span>
        </a>

        <a class="active" href="report.html">
          <span class="nav-label">📊 報表中心</span>
          <span class="pill">Reports</span>
        </a>
      </div>
    </aside>

    <main class="main">

      <div class="reportPage">

        <div class="reportHeader">
          <div>
            <h2>📊 報表中心</h2>
            <p>
              依日期、機台、產品與檢測結果篩選，
              並匯出 CSV 或列印 / 儲存 PDF。
            </p>
          </div>
        </div>

        <section class="reportFilters">

          <div class="reportField">
            <label for="reportDateFrom">開始日期</label>
            <input
              id="reportDateFrom"
              type="datetime-local"
            />
          </div>

          <div class="reportField">
            <label for="reportDateTo">結束日期</label>
            <input
              id="reportDateTo"
              type="datetime-local"
            />
          </div>

          <div class="reportField">
            <label for="reportSystem">機台</label>
            <select id="reportSystem">
              <option value="">全部機台</option>
            </select>
          </div>

          <div class="reportField">
            <label for="reportProduct">產品</label>
            <input
              id="reportProduct"
              type="text"
              maxlength="100"
              placeholder="全部產品"
            />
          </div>

          <div class="reportField">
            <label for="reportStatus">結果</label>

            <select id="reportStatus">
              <option value="">全部</option>
              <option value="OK">OK</option>
              <option value="NG">NG</option>
            </select>
          </div>

          <div class="reportActions">

            <button
              class="btn btnPrimary"
              id="reportSearchBtn"
              type="button"
            >
              🔍 查詢
            </button>

            <button
              class="btn"
              id="reportResetBtn"
              type="button"
            >
              清除條件
            </button>

            <button
              class="btn"
              id="reportCsvBtn"
              type="button"
            >
              ⬇ 匯出 CSV
            </button>

            <button
              class="btn"
              id="reportPdfBtn"
              type="button"
            >
              🖨 列印 / 儲存 PDF
            </button>

          </div>

        </section>

        <section class="reportSummary">

          <div class="reportSummaryCard">
            <span>總筆數</span>
            <strong id="reportTotal">0</strong>
          </div>

          <div class="reportSummaryCard">
            <span>OK</span>
            <strong id="reportOk">0</strong>
          </div>

          <div class="reportSummaryCard">
            <span>NG</span>
            <strong id="reportNg">0</strong>
          </div>

          <div class="reportSummaryCard">
            <span>良率</span>
            <strong id="reportYield">0.0%</strong>
          </div>

        </section>

        <section class="reportTablePanel">

          <div class="reportTableHeader">
            <div>
              <h3>檢測明細</h3>
              <p id="reportResultMessage">
                尚未查詢資料。
              </p>
            </div>
          </div>

          <div class="reportTableWrap">

            <table class="reportTable">

              <thead>
                <tr>
                  <th>時間</th>
                  <th>機台</th>
                  <th>Case ID</th>
                  <th>產品</th>
                  <th>結果</th>
                  <th>瑕疵圖片</th>
                </tr>
              </thead>

              <tbody id="reportTableBody">
                <tr>
                  <td colspan="6" class="reportEmpty">
                    尚未查詢資料
                  </td>
                </tr>
              </tbody>

            </table>

          </div>

        </section>

        <div class="reportPrintFooter">
          瑕疵辨識與分流系統－檢測報表
        </div>

      </div>

    </main>

  </div>
</body>
</html>
