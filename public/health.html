<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系統健康狀態</title>
  <link rel="stylesheet" href="health.css" />
</head>

<body>
  <main class="health-page">
    <section class="health-card">
      <h1>系統健康狀態</h1>
      <p class="subtitle">AIoT 瑕疵監測系統服務狀態</p>

      <div id="overall" class="overall">
        正在檢查系統狀態...
      </div>

      <div class="status-grid">
        <div class="status-item">
          <span>MongoDB</span>
          <strong id="database">檢查中...</strong>
        </div>

        <div class="status-item">
          <span>Email / SMTP</span>
          <strong id="email">檢查中...</strong>
        </div>

        <div class="status-item">
          <span>MQTT</span>
          <strong id="mqtt">檢查中...</strong>
        </div>

        <div class="status-item">
          <span>Gemini AI</span>
          <strong id="gemini">檢查中...</strong>
        </div>

        <div class="status-item">
          <span>系統版本</span>
          <strong id="version">-</strong>
        </div>

        <div class="status-item">
          <span>運行時間</span>
          <strong id="uptime">-</strong>
        </div>
      </div>

      <div class="actions">
        <button id="refreshBtn" type="button">重新檢查</button>
        <a href="dashboard.html">返回儀表板</a>
      </div>
    </section>
  </main>

  <script src="health.js"></script>
</body>
</html>
