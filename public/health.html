<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系統健康狀態</title><script src="auth-bootstrap.js?v=20261007-1"></script><link rel="stylesheet" href="style.css?v=20261007-4"><link rel="stylesheet" href="health.css?v=20261007-6"><script defer src="core.js?v=20261007-4"></script><link href="unified-sidebar.css?v=20261007-4" rel="stylesheet"/><link href="plan-a-layout.css?v=20261007-6" rel="stylesheet"/></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo"></div><div><h1>瑕疵辨識與分流系統</h1><p>Defect System</p></div></div><div class="nav"></div></aside><main class="main"><div class="healthPage"><div class="healthHeader"><div><h2>🩺 系統健康狀態</h2><p>只顯示後端實際檢查結果，不使用假連線狀態。</p></div><button class="btn btnPrimary" id="refreshBtn" type="button">⟳ 重新檢查</button></div><section class="healthPanel"><div id="overall" class="overall">正在檢查系統狀態...</div><div class="status-grid"><div class="status-item"><span>MongoDB</span><strong id="database">檢查中...</strong></div><div class="status-item"><span>Email / SMTP</span><strong id="email">檢查中...</strong></div><div class="status-item"><span>MQTT Broker</span><strong id="mqtt">檢查中...</strong></div><div class="status-item"><span>Gemini AI</span><strong id="gemini">檢查中...</strong></div><div class="status-item"><span>機台連線狀態</span><strong id="machineConnection">檢查中...</strong><small class="status-source" id="machineConnectionDetail">依機台最後回報時間判斷</small></div><div class="status-item"><span>運行時間</span><strong id="uptime">-</strong></div></div><p class="health-note">注意：MQTT「已連線」只代表後端已連上 Broker。機台連線狀態依最後回報時間判斷：10 秒內為正常、10～30 秒為連線不穩、超過 30 秒為離線；從未回報則顯示尚未連線。這是通訊回報狀態，不等同於機械手臂實際動作成功。</p></section></div></main></div><script src="health.js?v=20261007-6"></script></body></html>
