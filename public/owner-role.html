<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>本人角色設定</title><style>body{font-family:system-ui,sans-serif;background:#081627;color:#e8f1ff;display:grid;place-items:center;min-height:100vh;margin:0}main{background:#11243c;padding:32px;border:1px solid #385778;border-radius:15px;max-width:460px;width:calc(100% - 60px)}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:10px 0 20px;border-radius:8px}button{background:#119b64;color:white;font-weight:bold;cursor:pointer;border:0}a{color:#8dc6fa}small{color:#b7c9dc}</style></head><body><main><h2>本人角色設定</h2><p id="account">正在確認帳號…</p><p>此功能只限受保護帳號本人。其他管理員不能修改你的角色或停用你的帳號。</p><form id="form"><label>選擇身分<select id="role"><option value="super_admin">系統管理員</option><option value="tenant_admin">客戶管理員</option><option value="user">一般客戶</option></select></label><label>再次輸入目前的登入密碼<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">確認修改我的身分</button></form><p id="status" role="status"></p><small>修改後原登入狀態會失效，請重新登入。降級後仍可回到本頁恢復系統管理員。</small><p><a href="dashboard.html">返回首頁</a></p></main><script>const f=document.getElementById('form'),s=document.getElementById('status');fetch('/api/owner/role',{credentials:'include',cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.message||'請先登入');document.getElementById('account').textContent='帳號：'+d.email;document.getElementById('role').value=d.role;}).catch(e=>{s.textContent=e.message;f.hidden=true});f.addEventListener('submit',async e=>{e.preventDefault();if(!confirm('確定要修改自己的帳號身分？修改後需要重新登入。'))return;const button=f.querySelector('button');button.disabled=true;s.textContent='處理中…';try{const r=await fetch('/api/owner/role',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:document.getElementById('role').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'修改失敗');s.textContent=d.message;f.hidden=true;setTimeout(()=>location.href='login.html',1800)}catch(err){s.textContent=err.message}finally{button.disabled=false;document.getElementById('password').value=''}});</script></body></html>
