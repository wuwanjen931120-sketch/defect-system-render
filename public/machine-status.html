<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>機台狀態 - 瑕疵辨識與分流系統</title>

  <script src="auth-bootstrap.js?v=20260811-1"></script>

  <link rel="stylesheet" href="style.css" />

  <link rel="stylesheet" href="machine-status.css?v=20261009-2" />

  <script defer src="core.js?v=20260811-2"></script>
  <script defer src="machine-status.js?v=20261009-2"></script>
<link href="unified-sidebar.css?v=20261007-2" rel="stylesheet"/><link href="plan-a-layout.css?v=20261007-6" rel="stylesheet"/></head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"></div>

        <div>
          <h1>瑕疵辨識與分流系統</h1>
          <p>Defect System</p>
        </div>
      </div>

      <div class="nav">
        <a href="dashboard.html">
          <span class="nav-label">🏠 首頁</span>
          <span class="pill">Dashboard</span>
        </a>

        <a href="logs.html">
          <span class="nav-label">🧾 事件紀錄</span>
          <span class="pill">Logs</span>
        </a>

        <a href="settings.html">
          <span class="nav-label">⚙️ 系統設定</span>
          <span class="pill">Settings</span>
        </a>

        <a href="ai.html">
          <span class="nav-label">🤖 AI 助理</span>
          <span class="pill">AI</span>
        </a>

        <a href="health.html">
          <span class="nav-label">🩺 系統健康</span>
          <span class="pill">Health</span>
        </a>

        <a href="alerts.html">
          <span class="nav-label">🚨 告警中心</span>
          <span class="pill">Alerts</span>
        </a>

        <a class="active" href="machine-status.html">
          <span class="nav-label">🖥️ 機台狀態</span>
          <span class="pill">Machines</span>
        </a>
      </div>
    </aside>

    <main class="main">
      <div class="machinePage">

        <div class="machineHeader">
          <div>
            <h2>🖥️ 即時機台狀態</h2>
            <p>
              分開查看「檢測資料回報」與「實體機械手臂 heartbeat」，
              避免把 MQTT Broker 或資料上報誤認為手臂已連線。
            </p>
          </div>

          <button
            class="btn btnPrimary"
            id="refreshMachinesBtn"
            type="button"
          >
            ⟳ 重新整理
          </button>
        </div>

        <section class="machineSummary">

          <div class="machineSummaryCard">
            <span>全部機台</span>
            <strong id="machineCountAll">0</strong>
          </div>

          <div class="machineSummaryCard machineSummaryOnline">
            <span>資料回報正常</span>
            <strong id="machineCountOnline">0</strong>
          </div>

          <div class="machineSummaryCard machineSummaryOffline">
            <span>資料未回報</span>
            <strong id="machineCountOffline">0</strong>
          </div>

          <div class="machineSummaryCard machineSummaryOnline">
            <span>實體手臂已連線</span>
            <strong id="robotCountOnline">0</strong>
          </div>

          <div class="machineSummaryCard machineSummaryOffline">
            <span>實體手臂未連線</span>
            <strong id="robotCountOffline">0</strong>
          </div>

          <div class="machineSummaryCard">
            <span>手臂 heartbeat 判斷</span>
            <strong id="robotHeartbeatWindow">15 秒</strong>
          </div>

        </section>

        <section class="machinePanel">

          <div class="machineToolbar">

            <div class="machineTabs">

              <button
                class="machineTab active"
                data-filter="all"
                type="button"
              >
                全部
              </button>

              <button
                class="machineTab"
                data-filter="online"
                type="button"
              >
                Online
              </button>

              <button
                class="machineTab"
                data-filter="offline"
                type="button"
              >
                Offline
              </button>

            </div>

            <div class="machineAutoRefresh">
              <label>
                <input
                  id="machineAutoRefresh"
                  type="checkbox"
                  checked
                />
                每 15 秒自動更新
              </label>
            </div>

          </div>

          <div
            id="machineStatusMessage"
            class="machineStatusMessage"
          ></div>

          <div
            id="machineCards"
            class="machineCards"
          >
            <div class="machineEmpty">
              正在讀取機台狀態...
            </div>
          </div>

        </section>

      </div>
    </main>
  </div>
</body>
</html>
